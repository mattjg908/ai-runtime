[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-runtime-gateway"
version = "0.1.0"
description = "Typed model gateway for the AI runtime project"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai",
    "pydantic>=2,<3",
    "pydantic-settings",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
